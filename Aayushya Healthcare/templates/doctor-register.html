<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration | Aayushya Healthcare</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #00bfa5;
            --primary-dark: #00897b;
            --secondary: #263238;
            --accent: #ff4081;
            --success: #00c853;
            --warning: #ffd600;
            --error: #ff1744;
            
            --bg-light: #f0f4f8;
            --card-light: #ffffff;
            --text-light: #37474f;
            --input-bg-light: #f5f7fa;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            overflow-x: hidden;
            position: relative;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .shape-1 { top: -100px; left: -100px; width: 500px; height: 500px; background: rgba(0, 191, 165, 0.2); }
        .shape-2 { bottom: -100px; right: -100px; width: 400px; height: 400px; background: rgba(255, 64, 129, 0.15); }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .reg-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            padding: 50px;
        }

        .reg-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .reg-header h1 {
            color: var(--primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .reg-header p {
            color: var(--secondary);
            font-size: 16px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            color: var(--primary-dark);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group label .required {
            color: var(--error);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text-light);
            background: var(--input-bg-light);
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 191, 165, 0.1);
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 20px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 191, 165, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            font-size: 14px;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-link a:hover {
            color: var(--primary-dark);
        }

        .error-message {
            color: var(--error);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            display: none;
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .reg-card {
                padding: 30px;
            }

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }

            .reg-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="main-wrapper">
        <div class="reg-card">
            <div class="reg-header">
                <h1>Doctor Registration</h1>
                <p>Join our healthcare platform and manage your practice</p>
            </div>

            <div class="success-message" id="successMessage"></div>

            <form id="doctorRegisterForm" enctype="multipart/form-data">
                <!-- Personal Information -->
                <div class="form-section">
                    <div class="section-title">Personal Information</div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name <span class="required">*</span></label>
                            <input type="text" name="fullName" placeholder="Dr. John Doe" required pattern="^[A-Za-z.-]{2,} [A-Za-z.-]{2,}(?: [A-Za-z.-]{2,})?$">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth <span class="required">*</label>
                            <input type="date" name="dob" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender <span class="required">*</label>
                            <select name="gender" required>
                                <option value="" hidden selected disabled>Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" name="address" placeholder="Your address" pattern="^[A-Za-z0-9,./#\- ]{5,120}$">
                        </div>
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="form-section">
                    <div class="section-title">Contact Information</div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Mobile Number <span class="required">*</span></label>
                            <input type="tel" name="mobile" placeholder="+91 XXXXXXXXXX" required pattern="^[6-9]\d{9}$">
                        </div>
                        <div class="form-group">
                            <label>Alternate Phone</label>
                            <input type="tel" name="alternatePhone" placeholder="+91 XXXXXXXXXX" pattern="^[6-9]\d{9}$">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" name="email" placeholder="doctor@example.com" required>
                    </div>
                </div>

                <!-- Professional Information -->
                <div class="form-section">
                    <div class="section-title">Professional Credentials</div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Medical License Number <span class="required">*</span></label>
                            <input type="text" name="licenseNumber" placeholder="G-XXXXX" pattern="^(G|GMC)[0-9\/-]{4,15}$" required>
                        </div>
                        <div class="form-group">
                            <label>Specialization <span class="required">*</span></label>
                            <select name="specialization" required>
                                <option value="" hidden selected disabled>Select Specialization</option>
                                <option value="General Practice">General Practice</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Gastroenterology">Gastroenterology</option>
                                <option value="Psychiatry">Psychiatry</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Qualification <span class="required">*</span></label>
                            <input type="text" name="qualification" placeholder="MBBS, MD, etc." required pattern="^[A-Za-z.,() ]+$">
                        </div>
                        <div class="form-group">
                            <label>Years of Experience <span class="required">*</span></label>
                            <input type="number" name="experienceYears" placeholder="0" min="0" max="50" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Hospital/Clinic Name <span class="required">*</span></label>
                            <input type="text" name="hospitalName" placeholder="Hospital/Clinic name" required pattern="^[A-Za-z0-9.&\- ]{3,60}$">
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" placeholder="Department" pattern="^[A-Za-z]+( [A-Za-z]+)*$">
                        </div>
                    </div>
                </div>

                <!-- Availability & Fees -->
                <div class="form-section">
                    <div class="section-title">Availability & Fees</div>
                    
                    <div class="form-group">
                        <label>Consultation Fee (₹) <span class="required">*</span></label>
                        <input type="number" name="consultationFee" placeholder="500" min="0" max="5000" step="50" required>
                    </div>

                    <div class="form-group">
                        <label>Available Days (comma separated) <span class="required">*</span></label>
                        <input type="text" name="availableDays" placeholder="Mon,Tue,Wed,Thu,Fri,Sat,Sun" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Available From (HH:MM) <span class="required">*</span></label>
                            <input type="time" name="availableFrom" required>
                        </div>
                        <div class="form-group">
                            <label>Available To (HH:MM) <span class="required">*</span></label>
                            <input type="time" name="availableTo" required>
                        </div>
                    </div>
                </div>

                <!-- Security -->
                <div class="form-section">
                    <div class="section-title">Security</div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password <span class="required">*</span></label>
                            <input type="password" name="password" placeholder="At least 6 characters" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label>Confirm Password <span class="required">*</span></label>
                            <input type="password" name="confirmPassword" placeholder="Confirm password" required minlength="6">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">
                    <span class="btn-text">Register as Doctor</span>
                    <span class="loading" id="loadingSpinner">
                        <i class="fas fa-spinner fa-spin"></i> Registering...
                    </span>
                </button>
                <div class="error-message"></div>

                <div class="login-link">
                    Already have an account? <a href="/login">Login here</a><br>
                    <a href="/">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('doctorRegisterForm');
        const successMessage = document.getElementById('successMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.querySelector('.btn-text');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous messages
            successMessage.style.display = 'none';
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');

            // Show loading state
            loadingSpinner.style.display = 'inline';
            btnText.style.display = 'none';

            try {
                const formData = new FormData(form);
                
                const response = await fetch('/api/register/doctor', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.textContent = '✓ ' + data.message + ' Your Doctor ID: ' + data.doctor_id;
                    successMessage.style.display = 'block';
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 2000);
                } else {
                    // Show error message
                    const errorEl = document.querySelector('.error-message');
                    if (errorEl) {
                        errorEl.textContent = data.message;
                        errorEl.style.display = 'block';
                    } else {
                        alert(data.message);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Registration failed. Please try again.');
            } finally {
                // Hide loading state
                loadingSpinner.style.display = 'none';
                btnText.style.display = 'inline';
            }
        });

        // Prevent form submission if passwords don't match
        const passwordField = form.querySelector('input[name="password"]');
        const confirmPasswordField = form.querySelector('input[name="confirmPassword"]');

        confirmPasswordField.addEventListener('change', () => {
            if (passwordField.value !== confirmPasswordField.value) {
                confirmPasswordField.setCustomValidity('Passwords do not match');
            } else {
                confirmPasswordField.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
